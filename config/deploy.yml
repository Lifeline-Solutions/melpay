# config/deploy.yml
#
# Salato Events
# Rails 8 + PostgreSQL 16 + Redis 7 + Sidekiq + Kamal 2
# Production server: Contabo VPS (207.180.216.54)

service: malpayment

image: ger619/malpayment

# --------------------------------------------------
# Production servers
#
#   web    -> Puma, behind kamal-proxy
#   worker -> Sidekiq, same image, different command
# --------------------------------------------------

servers:
  web:
    - 84.247.137.120

  worker:
    hosts:
      - 84.247.137.120
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    # Sidekiq serves no HTTP, so it must not be registered
    # with kamal-proxy or healthchecked as a web app.
    proxy: false

# Give Rails/Kamal enough time for the first boot,
# PostgreSQL startup and database preparation.
deploy_timeout: 120

# --------------------------------------------------
# Proxy / Domain
# --------------------------------------------------

proxy:
  ssl: true
  host: malpayment.com

  healthcheck:
    path: /up
    interval: 3
    timeout: 10

# --------------------------------------------------
# Container Registry
# --------------------------------------------------

registry:
  server: ghcr.io
  username: ger619
  password:
    - KAMAL_REGISTRY_PASSWORD

# --------------------------------------------------
# Docker Build
# --------------------------------------------------

builder:
  arch: amd64

# --------------------------------------------------
# Application Environment
# --------------------------------------------------

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"

    # ------------------------------------------------
    # PostgreSQL
    #
    # The accessory is named "db", so on the Kamal
    # network the container is: malpayment-db
    # ------------------------------------------------
    PGHOST: malpayment-user-db
    PGPORT: "5432"
    PGUSER: malpayment
    PG_DATABASE: malpayment_production

    # ------------------------------------------------
    # Redis / Sidekiq
    #
    # The accessory is named "redis", so on the Kamal
    # network the container is: malpayment-redis
    # ------------------------------------------------
    REDIS_URL: redis://malpayment-redis:6379/0
    SIDEKIQ_CONCURRENCY: "5"

    # ------------------------------------------------
    # Email (Resend over SMTP)
    #
    # salato.app is verified in Resend, so the From
    # address must stay on that domain or Resend
    # rejects the message.
    # ------------------------------------------------
    # ------------------------------------------------
    # WhatsApp ticket delivery
    #
    # WhatsappTicketDeliveryJob sends the ticket PDF
    # (the same file the email attaches) to the buyer
    # through the OpenWA accessory once the order is
    # paid.
    #
    # Rails talks to OpenWA on the internal Docker
    # network (salato-events-openwa:2785), so the PDF
    # never crosses the public proxy.
    #
    # wa.salato.app is for humans only: QR pairing and
    # session health. Do NOT point Rails at it.
    # ------------------------------------------------
    #OPENWA_BASE_URL: http://malpayment-openwa:2785

    # The session UUID from the OpenWA dashboard, NOT
    # the session name. The name gets a 400 "session is
    # not active". If the phone is ever re-paired as a
    # NEW session, paste its UUID here and redeploy.
    #OPENWA_SESSION_ID: "7c809ee6-e04b-4d20-8b9f-5a2f987bd7d1"

  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD


    # Resend API key, used as the SMTP password in
    # config/environments/production.rb.

    # OpenWA key, sent by Rails as the X-API-Key header.
    # .kamal/secrets derives this and API_MASTER_KEY from
    # one .env value so the two can never drift.

# --------------------------------------------------
# Persistent Rails Storage
# --------------------------------------------------

volumes:
  - "malpayment_storage:/rails/storage"

# --------------------------------------------------
# Rails Assets
# --------------------------------------------------

asset_path: /rails/public/assets

# --------------------------------------------------
# Handy shortcuts
#
#   kamal console   Rails console
#   kamal shell     bash in the app container
#   kamal logs      follow web logs
#   kamal dbc       database console
#   kamal sidekiq   follow Sidekiq (worker) logs
# --------------------------------------------------

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  sidekiq: app logs -r worker -f

# --------------------------------------------------
# Accessories
# --------------------------------------------------

accessories:

  # ------------------------------------------------
  # PostgreSQL
  #
  # Bound to localhost on the VPS only. Do NOT expose
  # it publicly: Rails reaches it over the Kamal
  # network at salato-events-db:5432.
  # ------------------------------------------------
  db:
    image: postgres:16
    host: 84.247.216.54
    port: "127.0.0.1:5432:5432"

    env:
      clear:
        POSTGRES_USER: melpay
        POSTGRES_DB: melpay_production
      secret:
        - POSTGRES_PASSWORD

    directories:
      - data:/var/lib/postgresql/data

  # ------------------------------------------------
  # Redis (Sidekiq queue backend)
  #
  # Bound to localhost on the VPS only. Do NOT expose
  # it publicly: it has no auth and relies on being
  # unreachable. Rails and Sidekiq reach it at
  # salato-events-redis:6379.
  #
  # noeviction is required for Sidekiq: the default
  # policy would silently drop queued jobs under
  # memory pressure. appendonly keeps the queue across
  # restarts.
  # ------------------------------------------------
  redis:
    image: redis:7-alpine
    host: 84.247.137.120
    port: "127.0.0.1:6379:6379"
    cmd: "redis-server --appendonly yes --maxmemory-policy noeviction"

    directories:
      - data:/data

  # ------------------------------------------------
  # OpenWA (WhatsApp gateway)
  #
  # Sends ticket PDFs to order.customer_phone once
  # payment clears.
  #
  # IMAGE — why :main and not :latest
  #   :latest is release v0.23.5, where every PDF/image
  #   send fails with a 500 since WhatsApp Web's
  #   17 Sep 2026 update ("Data passed to getter must
  #   include an id property"). The fix is on OpenWA's
  #   main branch (PR #1670) but not in a release yet.
  #   Once a release newer than 0.23.5 is out, pin it
  #   here (e.g. ghcr.io/rmyndharis/openwa:0.23.6).
  #
  #   :main is not re-pulled automatically. To update:
  #     ssh root@207.180.216.54 docker pull ghcr.io/rmyndharis/openwa:main
  #     kamal accessory reboot openwa
  #
  # PUBLISHED on wa.salato.app because pairing a number
  # means scanning a QR code in a browser. Protected by:
  #   - TLS, issued by kamal-proxy
  #   - the X-API-Key header on every API route
  #   - Swagger switched off
  #
  # DNS: an A record for wa -> 207.180.216.54 at
  # Cloudflare, DNS-only (grey cloud), or Cloudflare
  # answers the Let's Encrypt challenge instead of
  # kamal-proxy and the certificate never issues.
  # ------------------------------------------------
