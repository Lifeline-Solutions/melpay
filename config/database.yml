# Rails database configuration
# Uses DATABASE_URL if present (and sanitized in boot), otherwise falls back to PG* env vars.

default: &default
  url: <%= ENV['DATABASE_URL'] if ENV['DATABASE_URL'].present? %>
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV['PGUSER'] || 'postgres' %>
  password: <%= ENV['PGPASSWORD'] || '' %>
  host: <%= ENV['PGHOST'] || 'localhost' %>
  port: <%= ENV['PGPORT'] || 5432 %>

development:
  primary:
    <<: *default
    database: <%= ENV['PG_DATABASE'] || 'melpay_development' %>
  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_development' %>


test:
  primary:
    <<: *default
    database: <%= ENV['PG_TEST_DATABASE'] || 'melpay_test' %>
  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'melpay_test' %>


production:
  primary:
    <<: *default
    database: <%= ENV['PG_DATABASE'] || 'melpay_production' %>
  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_production' %>
