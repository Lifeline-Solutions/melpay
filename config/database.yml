# Rails database configuration
# Uses DATABASE_URL if present; otherwise falls back to PG* env vars.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV['DATABASE_URL'] if ENV['DATABASE_URL'].present? %>
  username: <%= ENV['PGUSER'] || 'postgres' %>
  password: <%= ENV['POSTGRES_PASSWORD'] || ENV['PGPASSWORD'] || '' %>
  host: <%= ENV['PGHOST'] || 'localhost' %>
  port: <%= ENV['PGPORT'] || 5432 %>

development:
  primary:
    <<: *default
    database: <%= ENV['PG_DATABASE'] || 'melpay_development' %>

  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_development' %>
  cache:
    <<: *default
    database: <%= ENV['PG_CACHE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_development' %>


test:
  primary:
    <<: *default
    database: <%= ENV['PG_TEST_DATABASE'] || 'melpay_test' %>

  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'melpay_test' %>

  cache:
    <<: *default
    database: <%= ENV['PG_CACHE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'melpay_test' %>

  cable:
    <<: *default
    database: <%= ENV['PG_CABLE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'melpay_test' %>



production:
  primary:
    <<: *default
    database: <%= ENV['PG_DATABASE'] || 'melpay_production' %>

  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_production' %>

  cache:
    <<: *default
    database: <%= ENV['PG_CACHE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_production' %>

  cable:
    <<: *default
    database: <%= ENV['PG_CABLE_DATABASE'] || ENV['PG_DATABASE'] || 'melpay_production' %>

